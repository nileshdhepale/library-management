<div class="dashboard-container">
  <h2 class="dashboard-title">Welcome, Admin</h2>

  <div class="button-group">
    <button
      mat-raised-button
      color="primary"
      [routerLink]="['/admin/add-book']"
    >
      Add New Book
    </button>

    <button mat-raised-button color="accent" [routerLink]="['/admin/books']">
      View All Books
    </button>

    <button mat-raised-button color="accent" [routerLink]="['/admin/users']">
      View Users & Transactions
    </button>

    <button mat-raised-button color="accent" routerLink="/profile/edit">
      Edit Profile
    </button>
  </div>

  <div class="logout-container">

    <button
      mat-stroked-button
      color="warn"
      (click)="logout()"
      class="logout-btn"
    >
      Logout
    </button>
  </div>
</div>
