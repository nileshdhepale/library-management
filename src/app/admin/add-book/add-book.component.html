<div class="page-container">
  <mat-card class="add-book-card">
    <h2 class="form-title">📚 Add New Book</h2>
    <form [formGroup]="bookForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Title</mat-label>
        <input matInput formControlName="title" placeholder="Enter book title">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Author</mat-label>
        <input matInput formControlName="author" placeholder="Enter author's name">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>ISBN</mat-label>
        <input matInput formControlName="isbn" placeholder="Enter ISBN">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Published Date</mat-label>
        <input matInput type="date" formControlName="publishedDate">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Quantity</mat-label>
        <input matInput type="number" formControlName="quantity" placeholder="Number of copies">
      </mat-form-field>

  <button mat-raised-button color="primary" class="submit-btn" [disabled]="bookForm.invalid">
  <mat-icon class="btn-icon">add</mat-icon>
  Add Book
</button>
    </form>
  </mat-card>
</div>
